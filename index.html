<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/calculadora.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <script src="js/calculadora.js" defer></script>
    <title>Calculadora CS 1.6</title>
</head>
<body>
    <div class="c4">
        <div class="container">
            <div class="cables-c4">
                <div class="cable lila"></div>
                <div class="cable blanco"></div>
                <div class="cable verde"></div>
                <div class="cable azul"></div>
                <div class="cable rojo"></div>
            </div>
            <input type="text" class="screen" id="screen" readonly/>
            <input type="button" value="C" class="erase" id="erase"/>

            <div class="keys">
                <input type="button" value="7" class="btn" />
                <input type="button" value="8" class="btn" />
                <input type="button" value="9" class="btn" />

                <input type="button" value="/" class="operator" />
                <input type="button" value="4" class="btn"/>
                <input type="button" value="5" class="btn"/>
                <input type="button" value="6" class="btn"/>

                <input type="button" value="*" class="operator" />
                <input type="button" value="1" class="btn" />
                <input type="button" value="2" class="btn" />
                <input type="button" value="3" class="btn" />

                <input type="button" value="-" class="operator" />
                <input type="button" value="0" class="btn" />

                <input type="button" value="." class="dot" id="dot"/>
                <input type="button" value="=" class="equals" id="equals"/>
                <input type="button" value="+" class="operator" />
            </div>
        </div>
    </div>
    <div>
        <input type="button" value="Ir a cs_assault" id="btn-mapa" class="btn-mapa">
    </div>
    <div class="footer-creditos">
        <p>Hecho con nostalgia por Antonio Gutiérrez</p>
        <a href="https://github.com/tonigstm96" target="_blank" id="link-github">
            Mi Github <i class="fab fa-github"></i>
        </a>
    </div>
</body>
</html>
